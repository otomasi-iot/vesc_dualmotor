; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .

[env:stm32f103rct6]
platform = ststm32
board = genericSTM32F103RC
framework = stm32cube
board_build.mcu = stm32f103rct6
board_build.f_cpu = 72000000L
monitor_speed = 115200
upload_protocol = stlink

; Complete VESC firmware build for STM32F103RCT6
; All features included, will fix errors one by one
build_src_filter =
  -<*>
  ; Core files
  +<Src/main.c>
  +<Src/hw_setup.c>
  +<Src/hw_port.c>
  +<Src/hwconf/hal_gpio.c>
  +<Src/cmsis_rtos_compat.h>
  +<Src/conf_general_f103.c>
  +<Src/conf_custom.c>
  +<Src/confgenerator.c>
  +<Src/timeout.c>
  +<Src/events.c>
  +<Src/app_stubs_new.c>
  +<Src/bms.c>
  +<Src/flash_helper_f103.c>
  +<Src/crc.c>
  -<Src/hwconf/hw.c>
  -<Src/hwconf/shutdown.c>
  ; Drivers - all enabled for full VESC feature set
  +<Src/driver/timer.c>
  +<Src/driver/eeprom_f103.c>
  -<Src/driver/eeprom.c>
  +<Src/driver/servo_dec.c>
  +<Src/driver/pwm_servo.c>
  +<Src/driver/ledpwm.c>
  -<Src/driver/driver_stubs.c>
  -<Src/driver/nrf/*.c>
  ; Utilities - full VESC utilities
  +<Src/util/buffer.c>
  +<Src/util/crc.c>
  +<Src/util/utils_math.c>
  +<Src/util/utils_sys.c>
  +<Src/terminal.c>
  -<Src/util/mempools.c>
  ; Communication - packet + commands for VESC Tool support
  +<Src/comm/packet.c>
  +<Src/comm/commands.c>
  -<Src/comm/comm_can*.c>
  -<Src/comm/comm_usb*.c>
  -<Src/comm/log.c>
  ; Motor Control - essential (both mcpwm and mcpwm_foc for full compatibility)
  +<Src/motor/foc_math.c>
  +<Src/motor/mc_interface.c>
  +<Src/motor/mcpwm.c>
  +<Src/motor/mcpwm_foc.c>
  +<Src/motor/mcpwm_hal_init.c>
  -<Src/motor/mcpwm_hal_fault.c>
  -<Src/motor/mc_interface_stub.c>
  -<Src/motor/virtual_motor.c>
  -<Src/motor/test_motor_latency.c>
  ; Applications - ALL VESC apps enabled for dual motor hoverboard
  +<Src/applications/app.c>
  +<Src/applications/app_uartcomm_f1.c>
  +<Src/applications/app_adc.c>
  +<Src/applications/app_ppm.c>
  +<Src/applications/app_nunchuk.c>
  +<Src/applications/app_pas.c>
  -<Src/applications/app_uartcomm.c>
  -<Src/applications/app_custom*.c>
  -<Src/applications/app_dpv.c>
  -<Src/applications/app_skypuff.c>
  -<Src/applications/app_sten.c>
  -<Src/applications/er/*.c>
  -<Src/applications/finn/*.c>
  ; Encoder - excluded (hoverboard uses hall sensors not encoders)
  -<Src/encoder/*.c>
  ; IMU - excluded (missing bmi160.h library and other dependencies)
  -<Src/imu/*.c>
  ; CAN/DroneCAN - excluded (macro compatibility issues)
  -<Src/libcanard/*.c>
  ; FreeRTOS
  +<include/RTOS/croutine.c>
  +<include/RTOS/event_groups.c>
  +<include/RTOS/list.c>
  +<include/RTOS/queue.c>
  +<include/RTOS/stream_buffer.c>
  +<include/RTOS/tasks.c>
  +<include/RTOS/timers.c>
  +<include/RTOS/portable/GCC/ARM_CM3/port.c>
  +<include/RTOS/portable/MemMang/heap_4.c>
  +<include/RTOS/CMSIS_RTOS_V2/cmsis_os2.c>

build_flags =
  -std=gnu11
  -Os
  -ffunction-sections
  -fdata-sections
  -fno-exceptions
  -fno-unwind-tables
  -fno-asynchronous-unwind-tables
  -Wl,--gc-sections
  -DUSE_HAL_DRIVER
  -DSTM32F103xC
  -DHAS_BLACKMAGIC=0
  -DCAN_ENABLE=0
  -DHW_NAME="\"VESC_F103_HOVERBOARD\""
  -DHW_SOURCE="\"hw_setup.c\""
  -DHW_HEADER="\"hw_config.h\""
  -DHW_HAS_DUAL_MOTORS
  -DHW_HAS_3_SHUNTS
  -ISrc
  -ISrc/motor
  -ISrc/applications
  -ISrc/applications/er
  -ISrc/applications/finn
  -ISrc/comm
  -ISrc/driver
  -ISrc/driver/nrf
  -ISrc/encoder
  -ISrc/hwconf
  -ISrc/imu
  -ISrc/util
  -ISrc/libcanard
  -Iinclude
  -Iinclude/CMSIS/Core/Include
  -Iinclude/CMSIS/RTOS2/Include
  -Iinclude/RTOS/include
  -Iinclude/RTOS/CMSIS_RTOS_V2
  -Iinclude/RTOS/portable/GCC/ARM_CM3
